name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths: [ "backend/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "backend/**" ]

env:
  REGISTRY: ghcr.io

jobs:

  build:

    runs-on: [self-hosted, mini-pc-homelab]

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set image name (lowercase, required by registries)
      run: echo "IMAGE_NAME=$(echo '${{ github.repository }}-backend' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

    # This runner has Podman, not Docker (no `docker` binary, no buildx) --
    # docker/login-action and docker/build-push-action both shell out to a
    # `docker` executable and fail with "Unable to locate executable file:
    # docker" here, so login/build/push are done directly with the podman CLI
    # instead (which speaks the same registry/Containerfile format).
    - name: Log in to GitHub Container Registry (podman)
      if: github.event_name != 'pull_request'
      run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

    - name: Extract tags/labels
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=,format=short
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build the Backend image (podman)
      run: |
        set -euo pipefail
        tag_args=()
        while IFS= read -r tag; do
          [ -n "$tag" ] && tag_args+=(--tag "$tag")
        done <<< "${{ steps.meta.outputs.tags }}"
        podman build --file backend/main.Containerfile "${tag_args[@]}" backend

    - name: Push the Backend image (podman)
      if: github.event_name != 'pull_request'
      run: |
        set -euo pipefail
        while IFS= read -r tag; do
          [ -n "$tag" ] && podman push "$tag"
        done <<< "${{ steps.meta.outputs.tags }}"
