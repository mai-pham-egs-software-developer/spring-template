{{- if gt (len .Values.databases) 1 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres.fullname" . }}-init
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
data:
  init-extra-databases.sh: |
    #!/bin/bash
    # Only ever runs on the first boot of an empty data volume (see values.yaml).
    set -euo pipefail
    {{- range rest .Values.databases }}
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      SELECT 'CREATE DATABASE "{{ . }}"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ . }}')\gexec
    EOSQL
    {{- end }}
{{- end }}
