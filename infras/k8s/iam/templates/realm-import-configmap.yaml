{{- if .Values.realm.import.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-realm-import
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  {{ .Values.realm.import.name }}-realm.json: |
    {{- include "keycloak.realmJson" . | nindent 4 }}
{{- end }}
