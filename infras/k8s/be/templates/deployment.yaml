apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 {{ .Values.db.host }} {{ .Values.db.port }}; do
                echo "waiting for {{ .Values.db.host }}:{{ .Values.db.port }}..."
                sleep 2
              done
        # TCP-level check only -- does NOT confirm the "{{ .Values.keycloak.realm }}"
        # realm exists (see ../iam/README.md, "What this chart does NOT do"). If
        # that realm isn't provisioned yet, this initContainer succeeds but the
        # main container will still crash-loop on Spring Boot's blocking OIDC
        # discovery call at startup -- check `kubectl logs` for that, it's expected.
        - name: wait-for-keycloak
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              host="$(echo "{{ .Values.keycloak.baseUrl }}" | sed -E 's#^[a-z]+://##; s#:.*##')"
              port="$(echo "{{ .Values.keycloak.baseUrl }}" | sed -E 's#.*:##')"
              until nc -z -w2 "$host" "$port"; do
                echo "waiting for $host:$port..."
                sleep 2
              done
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.dbSecretName" . }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.dbSecretName" . }}
                  key: password
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI
              value: "{{ .Values.keycloak.baseUrl }}/realms/{{ .Values.keycloak.realm }}"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "{{ .Values.keycloak.baseUrl }}/realms/{{ .Values.keycloak.realm }}"
            - name: KEYCLOAK_ADMIN_SERVER_URL
              value: {{ .Values.keycloak.baseUrl | quote }}
            - name: KEYCLOAK_ADMIN_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.keycloakSecretName" . }}
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.keycloakSecretName" . }}
                  key: password
            - name: FILE_STORAGE_S3_ENDPOINT
              value: {{ .Values.objectStorage.endpoint | quote }}
            - name: FILE_STORAGE_S3_PATH_STYLE_ACCESS_ENABLED
              value: "true"
            - name: FILE_STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.objectStorageSecretName" . }}
                  key: root-user
            - name: FILE_STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.objectStorageSecretName" . }}
                  key: root-password
            - name: APP_CORS_ALLOWED_ORIGINS
              value: {{ .Values.cors.allowedOrigins | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          # No actuator health endpoint wired up -- "/" redirects unauthenticated
          # callers to OAuth2 login (3xx), and kubelet's httpGet probes treat any
          # 200-399 response as success, so this is a real (if coarse) liveness
          # signal without needing extra config.
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
