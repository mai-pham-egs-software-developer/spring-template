server:
  port: 8081

spring:
  application:
    name: main

  # Same Postgres container as Keycloak (infras/local/compose.yml), separate database so
  # file-storage's own stored_file table stays out of Keycloak's schema. That second `app`
  # database is created by an init script that only runs the FIRST time the postgres container's
  # data volume is initialized -- if you already had the stack running before this database was
  # added, recreate the volume (`docker compose down -v` in infras/local) or create it by hand
  # (`CREATE DATABASE app;` via psql/any client against localhost:45432).
  datasource:
    url: jdbc:postgresql://localhost:45432/craft
    username: keycloak
    password: keycloak
  jpa:
    open-in-view: false
    hibernate:
      # CHANGE-ME: fine for a template/dev setup with a single owner of the schema
      # (this module); swap for a real migration tool (Flyway/Liquibase) before production.
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          # "oidc" is just this registration's id -- it shows up in the
          # generated URLs (/oauth2/authorization/oidc, and in the
          # redirect-uri template below). Rename it to match your IdP if
          # you like; it is not a magic/reserved value.
          oidc:
            client-id: be-application
            client-secret: nB0B1jTGKNiUEWraPw0LFgCdyGJGfRgZcv0S31Ys5s3htFGjFaNbsCEW52gWqeKOCFd6LSrfWiO3fw2CqoiiGK
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          oidc:
            # Keycloak issuer for a realm is always {base-url}/realms/{realm}.
            # Spring Boot fetches {issuer-uri}/.well-known/openid-configuration
            # at application STARTUP (blocking) to resolve the authorization,
            # token, jwks and userinfo endpoints, so Keycloak must already be
            # up and reachable at this URL before `mvn spring-boot:run` boots
            # -- CHANGE-ME below to your actual Keycloak host/port and realm.
            issuer-uri: http://localhost:8080/realms/bootstrap
            user-name-attribute: preferred_username

      # Lets this app ALSO accept Bearer access tokens issued by the same
      # Keycloak realm (e.g. from the decoupled React SPA in ../../frontend,
      # which does its own login via keycloak-js and calls this API with
      # "Authorization: Bearer <token>" instead of a session cookie).
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bootstrap

security:
  - path: /monitor/*
    auth-type: BASIC
    username: admin
    password: admin
  - path: /operators/**
    auth-type: BEARER
  - path: /biz/**
    auth-type: BEARER
  - path: /api/**
    auth-type: BEARER

# RBAC policy storage for modules/security's Casbin enforcer (casbin-spring-boot-starter) --
# JDBC-backed (table casbin_rule, in this same Postgres DB) instead of a static file, so policy
# can change at runtime via CasbinPolicyController. model still comes from the bundled
# rbac_model.conf (keyMatch2 path matching) on first boot, then from casbin_model_config (see
# CasbinModelConfigInitializer). Policy itself has no seed file at all -- casbin_rule starts
# empty; the first p/g rows must be inserted directly. See docs/security.md.
casbin:
  model: classpath:casbin/rbac_model.conf
  store-type: jdbc
  table-name: casbin_rule
  initialize-schema: create
  # Ant-style path patterns that skip CasbinAuthorizationManager's org/role/permission check
  # entirely (still requires plain authentication) -- for something under a BEARER-protected
  # prefix above that should behave like /me.
  #   - /biz/organizations/me: the current caller's own orgs (userId comes from the token, not
  #     the path) -- inherently self-scoped, so open to any authenticated user. Prefer this over
  #     the entry below for anything that only needs "my orgs", e.g. bizz-fe's Select Organization
  #     screen right after login.
  #   - /biz/users/*/organizations: the same lookup but for an arbitrary {userId} in the path --
  #     any authenticated user, for any userId, no role/org grant needed.
  rbac-exempt-paths:
    - /biz/organizations/me
    - /biz/users/*/organizations

# Admin REST API connection to Keycloak (separate from the end-user OIDC/JWT config above) --
# backs KeycloakUserService, in particular the master-account bootstrap below. Authenticates
# against Keycloak's own "master" realm using the KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD from
# infras/local/compose.yml; manages users in this app's own "bootstrap" realm.
# CHANGE-ME: real admin credentials (ideally a confidential client + service account scoped to
# just realm-management, not the bootstrap superuser) before any shared/non-local deployment.
keycloak:
  admin:
    server-url: http://localhost:8080
    admin-realm: master
    realm: bootstrap
    client-id: admin-cli
    username: admin
    password: admin

app:
  cors:
    allowed-origins: http://localhost:5173, http://localhost:5174

  # MasterAccountInitializer ensures this account exists in Keycloak (created if missing,
  # password reset, realm-role assigned) on every boot, so a fresh environment always has one
  # working admin login. See docs/security.md.
  # CHANGE-ME: change the password before any shared/non-local deployment.
  master-account:
    enabled: true
    username: master
    email: master@example.com
    password: ChangeMe123!
    realm-role: admin

file-storage:
  bucket: my-bucket
  key-prefix: uploads
  upload:
    expiration: PT15M
  download:
    expiration: PT10M
  temp:
    ttl: PT24H
    cleanup-cron: "0 0 * * * *"
  s3:
    region: us-east-1
    # Points at the local MinIO from infras/local/compose.yml (`docker compose up` in that
    # directory) by default -- its S3 API is exposed on the host as localhost:49000, and
    # minio-init there creates the `my-bucket` bucket on first startup.
    # CHANGE-ME for real AWS S3: unset endpoint/path-style-access-enabled/access-key/secret-key --
    # credentials then come from the default AWS provider chain (env vars, ~/.aws/credentials,
    # IAM role, ...) instead.
    endpoint: http://localhost:49000
    path-style-access-enabled: true
    access-key: minioadmin
    secret-key: minioadmin
